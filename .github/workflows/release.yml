name: release

# A release is a tag. Pushing vX.Y.Z re-runs the suite against the exact tagged
# tree, then publishes that tree to npm with provenance (OIDC) so the community
# can verify the tarball came from this repo at this commit — the parity guarantee.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # create the GitHub Release
  id-token: write   # npm provenance via GitHub OIDC (tokenless attestation)

jobs:
  # Gate the publish on the PUBLISHED ARTIFACT, not just the source tree. `npm test`
  # exercises the working tree; verify-pack packs the tgz, installs it into a clean
  # temp dir (--omit=dev, empty $HOME) and boots `MC_SMOKE=1 mc` — catching a broken
  # `files:` manifest or a node-pty spawn-helper crash BEFORE it reaches npm. node-pty
  # prebuilds are per-platform, so we prove macOS (where we ship from) AND linux, on
  # both supported Node majors. The publish job `needs:` all four cells green.
  verify:
    name: verify tarball (${{ matrix.os }} · node ${{ matrix.node }})
    # Least privilege: this job installs and EXECUTES the packed tarball
    # (incl. postinstall); it must not inherit the workflow-level
    # contents:write + id-token:write, which only `publish` needs.
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install + source tests
        run: npm ci && npm test
      - name: Verify the packed tarball (pack → install → boot + negative control)
        run: npm run verify:pack

  publish:
    name: test + publish
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      # OIDC Trusted Publishing needs npm >= 11.5.1 (node 20 ships npm 10.x).
      # Pin to the 11.x line: npm@latest is now 12.x which requires node >=22.22,
      # incompatible with the node 20 we build/test on (EBADENGINE).
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g "npm@^11.5.1"

      # Re-verify the exact tagged tree — never publish a red build.
      - name: Install + test
        run: npm ci && npm test

      # Refuse to publish if the tag doesn't match package.json (drift guard).
      - name: Assert tag == package.json version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [[ "$PKG" != "${GITHUB_REF_NAME}" ]]; then
            echo "::error ::tag ${GITHUB_REF_NAME} != package.json ${PKG}"; exit 1
          fi

      # OIDC Trusted Publishing: with id-token:write and a trusted publisher
      # configured on npmjs.com for this repo+workflow, npm authenticates via the
      # short-lived OIDC token — no NODE_AUTH_TOKEN / long-lived secret needed.
      # Provenance is attested from the same OIDC identity.
      - name: Publish to npm (OIDC trusted publishing + provenance)
        run: npm publish --provenance --access public

      # Cut the Release with the preinstalled gh CLI (built-in GITHUB_TOKEN) —
      # no third-party action running under id-token:write (supply-chain).
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag
